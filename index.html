  }

  canvas#magic{position:fixed; inset:0; z-index:2; pointer-events:none;}
  canvas#dust{position:fixed; inset:0; z-index:5; pointer-events:none;}

  .stage{
    position:relative; z-index:4;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }

  /* ---------- liquid glass card (tuned to the garden palette) ---------- */
  .card{
    position:relative;
    width:100%; max-width:330px;
    padding:26px 24px 20px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    border-radius:30px;
    background:linear-gradient(155deg, rgba(196,226,216,.15), rgba(150,178,184,.05) 55%, rgba(206,192,220,.11));
    border:1px solid rgba(222,238,232,.24);
    backdrop-filter:blur(24px) saturate(150%) brightness(1.05);
    -webkit-backdrop-filter:blur(24px) saturate(150%) brightness(1.05);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.4),
      inset 0 -8px 26px -16px rgba(206,192,220,.3),
      0 36px 70px -28px rgba(0,0,0,.6);
    overflow:hidden;
    opacity:0;
    animation:cardIn .9s ease .55s forwards;
    transition:opacity .9s ease, transform .9s ease, filter .9s ease, box-shadow .5s ease, border-color .5s ease;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(10px) scale(.985);} to{opacity:1; transform:none;}}
  .card::before{                              /* specular sheen */
    content:""; position:absolute; left:-30%; top:-60%; width:160%; height:120%;
    background:linear-gradient(150deg, rgba(255,255,255,.3), rgba(255,255,255,0) 40%);
    pointer-events:none; opacity:.5; transform:rotate(-2deg);
  }
  .card:focus-within{
    border-color:rgba(255,255,255,.4);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      0 0 46px -8px rgba(255,236,196,.22),
      0 36px 70px -28px rgba(0,0,0,.6);
  }
  .card.igniting{border-color:rgba(255,244,220,.7); box-shadow:0 0 64px -6px rgba(255,236,196,.4), inset 0 1px 0 rgba(255,255,255,.55);}
  .card.dissolving{opacity:0; transform:translateY(-16px) scale(.96); filter:blur(10px) brightness(1.5); animation:none;}

  .eyebrow{
    font-size:.6rem; font-weight:400; letter-spacing:.2em; text-transform:uppercase;
    color:var(--text-3); margin-bottom:11px; padding-left:.2em;
    text-shadow:0 1px 10px rgba(0,0,0,.5);
  }
  .title{
    font-size:1.55rem; font-weight:300; line-height:1.1; color:var(--text); margin-bottom:16px;
  }
  .field{position:relative; z-index:1; width:100%; margin-bottom:18px;}
  textarea#thought{
    width:100%; height:74px; resize:none; border:0; outline:0; background:transparent;
    font-family:var(--font); font-weight:300; font-size:.95rem; line-height:1.55;
    text-align:center; color:var(--text); caret-color:var(--accent);
  }
  textarea#thought::placeholder{color:var(--text-4); font-weight:300;}
  textarea#thought::-webkit-scrollbar{width:0;}

  .cta{
    font-family:var(--font); font-weight:400; font-size:.9rem; letter-spacing:.015em;
    color:#fff; cursor:pointer;
    display:inline-flex; align-items:center; gap:.5em;
    padding:.8em 1.7em; border-radius:999px;
    background:#141a1c;                       /* solid soft black — fijo, claro como botón */
    border:1px solid rgba(255,255,255,.2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 14px 30px -12px rgba(0,0,0,.9);
    transition:transform .2s, background .25s, box-shadow .25s, opacity .25s;
  }
  .cta svg{width:15px; height:15px;}
  .cta:hover{transform:translateY(-1px); background:#1c2427; box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 18px 36px -12px rgba(0,0,0,.95);}
  .cta:active{transform:translateY(0);}
  .cta:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .cta:disabled{opacity:.4; cursor:not-allowed; transform:none;}

  .caption{
    margin-top:14px; font-size:.66rem; font-weight:300; letter-spacing:.32em;
    text-transform:lowercase; color:var(--text-4);
  }

  .after{
    position:absolute; inset:0; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:24px; padding:24px; text-align:center;
    opacity:0; pointer-events:none; transition:opacity 1.1s ease;
    background:radial-gradient(78% 50% at 50% 45%, rgba(2,8,7,.66), rgba(2,8,7,0) 74%);
  }
  .after.show{opacity:1; pointer-events:auto;}
  .after p{
    font-size:1.15rem; font-weight:400; line-height:1.55; color:#fff;
    max-width:320px; letter-spacing:.005em;
    text-shadow:0 2px 18px rgba(0,0,0,.9), 0 0 34px rgba(0,0,0,.7);
  }
  .ghost{
    font-family:var(--font); font-size:.84rem; font-weight:500; letter-spacing:.04em;
    color:#fff; cursor:pointer;
    padding:.72em 1.6em; border-radius:999px;
    background:#141a1c;
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 12px 28px -14px rgba(0,0,0,.9);
    transition:border-color .25s, color .25s, background .25s, transform .2s;
  }
  .ghost:hover{border-color:rgba(255,255,255,.5); background:#1c2427; transform:translateY(-1px);}

  @media (prefers-reduced-motion: reduce){
    .bg{animation:none; opacity:1;}
    .card{animation:none; opacity:1;}
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="veil"></div>
  <canvas id="magic"></canvas>
  <canvas id="dust"></canvas>

  <main class="stage">
    <div class="card" id="card">
      <span class="eyebrow">conéctate con el ahora</span>
      <h1 class="title">Suéltalo</h1>
      <div class="field">
        <textarea id="thought" maxlength="280" rows="2" aria-label="Escribe lo que quieres soltar"
          placeholder="Escribe lo que pesa…" spellcheck="false"></textarea>
      </div>
      <button class="cta" id="transmute" disabled>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3l1.6 5.1L19 9.4l-4.2 3.1L16 18l-4-3-4 3 1.2-5.5L5 9.4l5.4-.4L12 3z" fill="#fff" opacity=".95"/>
        </svg>
        Transmutar emoción
      </button>
      <span class="caption">escribe · suelta · respira</span>
    </div>

    <div class="after" id="after">
      <p id="affirmation"></p>
      <button class="ghost" id="again">Escribir de nuevo</button>
    </div>
  </main>

<script>
/* ---------------- Three.js: magical fireflies ---------------- */
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('magic');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true}); }
  catch(e){ return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
  camera.position.z = 5;

  const COUNT = Math.min(380, Math.round(innerWidth*0.6)+200);
  const pos=new Float32Array(COUNT*3), seed=new Float32Array(COUNT), speed=new Float32Array(COUNT),
        amp=new Float32Array(COUNT), psize=new Float32Array(COUNT), tint=new Float32Array(COUNT), mode=new Float32Array(COUNT);
  const RX=4.2, RY=3.4;
  for(let i=0;i<COUNT;i++){
    pos[i*3]=(Math.random()*2-1)*RX; pos[i*3+1]=(Math.random()*2-1)*RY; pos[i*3+2]=Math.random()*3-2.2;
    seed[i]=Math.random()*6.283; speed[i]=Math.random()*0.5+0.18; amp[i]=Math.random()*0.5+0.12;
    psize[i]=Math.random()*Math.random()*24+5; tint[i]=Math.random(); mode[i]=Math.random()<0.22?1:0;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('a_seed', new THREE.BufferAttribute(seed,1));
  geo.setAttribute('a_speed', new THREE.BufferAttribute(speed,1));
  geo.setAttribute('a_amp', new THREE.BufferAttribute(amp,1));
  geo.setAttribute('a_size', new THREE.BufferAttribute(psize,1));
  geo.setAttribute('a_tint', new THREE.BufferAttribute(tint,1));
  geo.setAttribute('a_mode', new THREE.BufferAttribute(mode,1));

  const mat=new THREE.ShaderMaterial({
    transparent:true, depthTest:false, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{u_time:{value:0}, u_ry:{value:RY}, u_dpr:{value:Math.min(devicePixelRatio||1,2)}},
    vertexShader:`
      attribute float a_seed,a_speed,a_amp,a_size,a_tint,a_mode;
      uniform float u_time,u_ry,u_dpr; varying float v_tw; varying float v_tint;
      void main(){
        vec3 p=position; float t=u_time;
        p.x+=sin(t*a_speed+a_seed)*a_amp;
        p.y+=cos(t*a_speed*0.8+a_seed*1.7)*a_amp*0.8;
        float dir=a_mode>0.5?-1.0:1.0;
        p.y+=mod(t*0.10*(0.5+a_speed)*dir+a_seed, 2.0*u_ry);
        p.y=mod(p.y+u_ry, 2.0*u_ry)-u_ry;
        v_tw=0.45+0.55*pow(0.5+0.5*sin(t*(1.2+a_speed*2.0)+a_seed*3.0),2.0);
        v_tint=a_tint;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        gl_PointSize=a_size*u_dpr*(3.0/-mv.z)*(0.7+0.5*v_tw);
      }`,
    fragmentShader:`
      precision mediump float; varying float v_tw; varying float v_tint;
      void main(){
        float d=length(gl_PointCoord-0.5);
        float a=pow(smoothstep(0.5,0.0,d),1.6);
        vec3 warm=vec3(1.0,0.93,0.78);     // pond/lily gold
        vec3 cool=vec3(0.80,0.92,0.86);    // soft foliage green-white
        vec3 col=mix(warm,cool,smoothstep(0.4,0.85,v_tint));
        gl_FragColor=vec4(col, a*v_tw*0.9);
      }`
  });
  const points=new THREE.Points(geo,mat); scene.add(points);

  let px=0,py=0,tpx=0,tpy=0;
  addEventListener('pointermove', e=>{tpx=(e.clientX/innerWidth-0.5);tpy=(e.clientY/innerHeight-0.5);},{passive:true});
  function size(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  size(); addEventListener('resize',size,{passive:true});
  const clock=new THREE.Clock();
  (function loop(){ requestAnimationFrame(loop);
    mat.uniforms.u_time.value = reduce?0.0:clock.getElapsedTime();
    px+=(tpx-px)*0.04; py+=(tpy-py)*0.04;
    points.position.x=px*0.5; points.position.y=-py*0.4; points.rotation.z=px*0.04;
    renderer.render(scene,camera);
  })();

  window.__magicBurst=()=>{
    for(let i=0;i<COUNT;i++){ if(Math.random()<0.4) psize[i]=Math.min(psize[i]*1.6,58); }
    geo.attributes.a_size.needsUpdate=true;
    setTimeout(()=>{ for(let i=0;i<COUNT;i++) psize[i]=Math.random()*Math.random()*24+5; geo.attributes.a_size.needsUpdate=true; },1800);
  };
})();

/* ---------------- dissolve: words -> drifting light ---------------- */
(() => {
  const DPR=Math.min(devicePixelRatio||1,2);
  const cv=document.getElementById('dust'), ctx=cv.getContext('2d');
  let W=0,H=0;
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
  resize(); addEventListener('resize',resize,{passive:true});
  const sp=document.createElement('canvas'); sp.width=sp.height=24; const sc=sp.getContext('2d');
  const g=sc.createRadialGradient(12,12,0,12,12,12);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,246,228,.85)');
  g.addColorStop(.7,'rgba(214,230,220,.4)'); g.addColorStop(1,'rgba(214,230,220,0)');
  sc.fillStyle=g; sc.fillRect(0,0,24,24);
  let parts=[];
  (function frame(){ ctx.clearRect(0,0,W,H);
    if(parts.length){ ctx.globalCompositeOperation='lighter';
      for(let i=parts.length-1;i>=0;i--){ const e=parts[i];
        e.life++; e.sway+=e.swaySp; e.vy+=-0.004; e.vx+=Math.sin(e.sway)*0.02; e.vx*=0.99;
        e.x+=e.vx+Math.sin(e.sway)*0.3; e.y+=e.vy;
        const lr=e.life/e.max; if(lr>=1){parts.splice(i,1);continue;}
        const tw=0.6+0.4*Math.sin(e.life*e.fsp+e.seed); const a=(1-lr*lr)*tw, s=e.size*(1.7-lr*0.9);
        ctx.globalAlpha=Math.max(0,a); ctx.drawImage(sp,e.x-s,e.y-s,s*2,s*2);
      } ctx.globalAlpha=1;
    } requestAnimationFrame(frame);
  })();
  window.__dissolve=(text,rect,style)=>{
    const padT=parseFloat(style.paddingTop)||0, padL=parseFloat(style.paddingLeft)||0, padR=parseFloat(style.paddingRight)||0;
    const innerW=Math.max(10,rect.width-padL-padR);
    const off=document.createElement('canvas'), oc=off.getContext('2d');
    const fpx=parseFloat(style.fontSize), lh=parseFloat(style.lineHeight)||fpx*1.55;
    off.width=Math.ceil(rect.width); off.height=Math.ceil(rect.height);
    oc.fillStyle='#fff'; oc.textBaseline='top'; oc.textAlign='center';
    oc.font=`${style.fontStyle} ${style.fontWeight} ${fpx}px ${style.fontFamily}`;
    const words=text.replace(/\s+/g,' ').trim().split(' '); const lines=[]; let cur='';
    for(const w of words){const tt=cur?cur+' '+w:w; if(oc.measureText(tt).width>innerW&&cur){lines.push(cur);cur=w;}else cur=tt;}
    if(cur)lines.push(cur);
    const cx=off.width/2; let y=padT; for(const ln of lines){oc.fillText(ln,cx,y);y+=lh;}
    const img=oc.getImageData(0,0,off.width,off.height).data;
    let cand=0; for(let i=3;i<img.length;i+=4) if(img[i]>90) cand++;
    const cap=(W<520?900:1400); let step=2; while((cand/(step*step))>cap&&step<7) step++;
    for(let py=0;py<off.height;py+=step) for(let px=0;px<off.width;px+=step)
      if(img[(py*off.width+px)*4+3]>90) spawn(rect.left+px, rect.top+py, .8);
    const n=W<520?80:130; for(let i=0;i<n;i++) spawn(rect.left+Math.random()*rect.width, rect.top+Math.random()*rect.height,1.2);
  };
  function spawn(x,y,sz){ parts.push({x,y,vx:(Math.random()-.5)*.6,vy:-(Math.random()*.9+.3),
    sway:Math.random()*6.28,swaySp:Math.random()*.05+.02,size:(Math.random()*2.4+1.3)*(sz||1),
    life:0,max:Math.random()*70+80,seed:Math.random()*6.28,fsp:Math.random()*.25+.1}); }
})();

/* ---------------- wiring ---------------- */
(() => {
  const ta=document.getElementById('thought'), btn=document.getElementById('transmute');
  const card=document.getElementById('card'), after=document.getElementById('after');
  const affirmation=document.getElementById('affirmation'), again=document.getElementById('again');
  const bg=document.getElementById('bg');
  const FINAL_MSG='Hacer consciente el dolor es el primer paso para destruirlo. Lo que hoy pusiste en palabras, ya dejó de ser tu dueño.';
  ta.addEventListener('input',()=>{btn.disabled=ta.value.trim()==='';});
  function transmute(){
    const text=ta.value.trim(); if(!text) return; btn.disabled=true;
    const style=getComputedStyle(ta), rect=ta.getBoundingClientRect();
    card.classList.add('igniting');
    setTimeout(()=>{ window.__dissolve(text,rect,style); ta.style.color='transparent';
      card.classList.remove('igniting'); card.classList.add('dissolving');
      bg.classList.add('bloom'); if(window.__magicBurst) window.__magicBurst();
      setTimeout(()=>bg.classList.remove('bloom'),1700);
    },200);
    setTimeout(()=>{ affirmation.textContent=FINAL_MSG; after.classList.add('show'); },1500);
  }
  function resetApp(){
    after.classList.remove('show'); ta.value=''; ta.style.color=''; btn.disabled=true;
    card.classList.remove('dissolving','igniting'); card.style.cssText='';
    setTimeout(()=>ta.focus(),300);
  }
  btn.addEventListener('click',transmute);
  again.addEventListener('click',resetApp);
  ta.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!btn.disabled) transmute(); });
})();
</script>
</body>
</html>
